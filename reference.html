<!doctype html>
<html lang="en">
<head>

  <title>Liquid Glass Reference Scene</title>

  <style>

    .tile { position:absolute; }

    .art { position:absolute; left:37.83px; top:37.83px; width:140.5px; height:140.5px; border-radius:37.8278px; background:rgba(255,255,255,.12); }
    .airplay { position:absolute; right:35.13px; top:35.13px; width:108.08px; height:108.08px; }
    .track, .artist { position:absolute; left:37.83px; font-size:40.5298px; line-height:49px; font-weight:510; }
    .track { top:194.54px; } .artist { top:243.18px; }
    .transport { position:absolute; left:64.85px; right:64.85px; bottom:27.08px; display:flex; align-items:center; justify-content:space-between; height:81px; }
    .transport svg { width:54px; height:38px; } .transport .play { width:64px; height:81px; }
    .connect { left:1029px; top:360px; width:479px; height:479px; border-radius:95.1656px; }
    .connect .symbol-well { position:absolute; width:177.64px; height:177.64px; }
    .connect svg { width:80px; height:80px; }
    .airplane { left:41.24px; top:41.24px; } .wifi { left:260.12px; top:41.24px; background:#0088ff; }
    .drop { left:41.24px; top:260.12px; background:#0088ff; }
    .connect .mini { width:80.36px; height:80.36px; } .mini svg { width:38px; height:38px; }
    .cell { left:260.12px; top:260.12px; background:#34c759; }
    .bt { left:357.4px; top:260.12px; background:#0088ff; }
    .hotspot { left:260.12px; top:357.4px; } .network { left:357.4px; top:357.4px; }
    .label { left:1315px; top:288px; width:386px; height:386px; padding:40.9007px; border-radius:76.6887px; display:flex; flex-direction:column; align-items:flex-start; justify-content:space-between; gap:25.56px; }
    .label .symbol-well { width:102.25px; height:102.25px; }
    .label img { width:36px; height:46px; }
    .label strong,.label span { display:block; font-size:35.7881px; line-height:43px; font-weight:590; }
    .label span { font-weight:510; color:rgba(255,255,255,.33); }
    .pill { left:905px; top:851px; width:346px; height:155.81px; padding:0 32.0795px; gap:22.91px; border-radius:229.139px; display:flex; align-items:center; }
    .pill .symbol-well { width:91.66px; height:91.66px; flex-shrink:0; }
    .pill img { width:41px; height:41px; }
    .pill strong,.pill span { display:block; font-size:32.0795px; line-height:38px; font-weight:590; }
    .pill span { font-weight:510; color:rgba(255,255,255,.33); }
    .slider { left:602px; top:721px; width:150px; height:333.09px; border-radius:220.588px; }
    .slider.volume { left:1830px; top:480px; width:151px; height:335.31px; }
    .level { position:absolute; bottom:0; left:0; width:100%; height:74.83%; background:rgba(255,255,255,.64); }
    .volume .level { height:50.33%; }
    .slider svg { position:absolute; bottom:35.38px; left:48px; width:54px; height:54px; color:#161520; }
    .toggle { width:164px; height:164px; border-radius:241.176px; display:grid; place-items:center; }
    .toggle svg { width:60px; height:60px; }
    .mute { left:780px; top:540px; } .lock { left:1283px; top:843px; } .camera { left:1479px; top:843px; } .battery { left:1675px; top:843px; } .mirror { left:213px; top:779px; }
    .defs { position:absolute; width:0; height:0; overflow:hidden; }
  </style>
</head>
<body>

    <symbol id="drop" viewBox="0 0 64 64"><circle cx="32" cy="27" r="5"/><path d="m32 38 16 24H16Z"/><path d="M20 39a17 17 0 1 1 24 0M13 46a27 27 0 1 1 38 0" fill="none" stroke="currentColor" stroke-width="4"/></symbol>

    <symbol id="mirror" viewBox="0 0 64 64"><rect x="4" y="10" width="38" height="30" rx="4" fill="none" stroke="currentColor" stroke-width="4"/><rect x="22" y="25" width="38" height="30" rx="4" fill="none" stroke="currentColor" stroke-width="4"/></symbol>
  </defs></svg>
  <div class="viewport"><main class="scene" aria-label="Reference scene reconstructed from supplied CSS">
    <h1>iOS 26 Liquid Glass UI Kit</h1>
    <div class="tile now glass-surface"><div class="art"></div><div class="airplay symbol-well"><svg class="filled-symbol"><use href="#drop"/></svg></div><div class="track">Track</div><div class="artist">Artist</div><div class="transport"><svg class="filled-symbol" style="transform:rotate(180deg)"><use href="#next"/></svg><svg class="filled-symbol play"><use href="#play"/></svg><svg class="filled-symbol"><use href="#next"/></svg></div></div>
    <div class="tile connect glass-surface"><div class="symbol-well airplane"><svg class="filled-symbol"><use href="#plane"/></svg></div><div class="symbol-well wifi"><svg class="filled-symbol"><use href="#wifi"/></svg></div><div class="symbol-well drop"><svg class="filled-symbol"><use href="#drop"/></svg></div><div class="symbol-well mini cell"><svg class="filled-symbol"><use href="#cell"/></svg></div><div class="symbol-well mini bt"><svg class="filled-symbol"><use href="#bt"/></svg></div><div class="symbol-well mini hotspot"><svg class="filled-symbol"><use href="#link"/></svg></div><div class="symbol-well mini network"><svg class="filled-symbol"><use href="#globe"/></svg></div></div>
    <div class="tile label glass-surface"><div class="symbol-well"><img src="assets/reference-bulb.svg" alt=""></div><div><strong>Title</strong><span>Detail</span></div></div>
    <div class="tile pill glass-surface"><div class="symbol-well"><img src="assets/reference-moon.svg" alt=""></div><div><strong>Title</strong><span>Detail</span></div></div>
    <div class="tile slider glass-surface"><div class="level"></div><svg class="filled-symbol"><use href="#sun"/></svg></div>
    <div class="tile slider volume glass-surface"><div class="level"></div><svg class="filled-symbol"><use href="#speaker"/></svg></div>
    <div class="tile toggle mute glass-surface"><svg class="filled-symbol"><use href="#speaker"/></svg></div>
    <div class="tile toggle lock glass-surface"><svg class="filled-symbol"><use href="#lock"/></svg></div>
    <div class="tile toggle camera glass-surface"><svg class="filled-symbol"><use href="#camera"/></svg></div>
    <div class="tile toggle battery glass-surface"><svg class="filled-symbol"><use href="#battery"/></svg></div>
    <div class="tile toggle mirror glass-surface"><svg class="filled-symbol"><use href="#mirror"/></svg></div>
  </main></div>
  <script>
    const scene = document.querySelector('.scene');
    function sizeScene() { const scale = window.innerWidth / 2048; scene.style.transform = `scale(${scale})`; document.querySelector('.viewport').style.height = `${1200 * scale}px`; }
    addEventListener('resize', sizeScene); sizeScene();
  </script>
</body>
</html>
